[policy_type]
# V1.1
# If permanent= Yes, this policy is still valid after reboot

[LTF-disable-throttling]
# If HW_protection= disabled, it will turn off
# SW shutdown protections and LVTS HW reboot protection
HW_protection= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 85000
min_target_tj= 85000
trip_tpcb= 78000
target_tpcb= 80000

[vtskin-param]
sensor= vtskin1
operation= coefficient
ref_sensor= [ap_ntc,battery,cam_ntc]
ref_coef= [156535200, 31483500, -96380000]

[thermalhal-threshold]
type= SKIN
sensor= vtskin1
level= [light, moderate, severe, critical, emergency, shutdown]
threshold= [40000, 42000, 47900, 55000, 59000, 60000]
hysteresis= [1000, 1000, 1000, 7100, 1000, 1000]

[user-virtual-sensor]
virtual_sensor= back_temp
ref_sensor= [ap_ntc,battery,cam_ntc]
ref_sensor_class=[kernel,kernel,kernel]
operation= coefficient
coef= [-1.01597,0.34328,1.696293]
offset=0
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= front_temp
ref_sensor= [ap_ntc,battery,cam_ntc]
ref_sensor_class=[kernel,kernel,kernel]
operation= coefficient
coef= [1.565352,0.314835,-0.9638]
offset=0
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[mtk-cpu-table-mapping]
mode= enabled
sensor= front_temp
cluster= 0
threshold= [40000, 41000, 45000, 47000, 49000]
hysteresis= [2000, 2000, 2000, 2000, 2000]
freq= [1800000, 1600000, 1400000, 1300000, 1100000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= front_temp
cluster= 1
threshold= [40000, 42000, 44000, 46000, 48000]
hysteresis= [2000, 2000, 2000, 2000, 2000]
freq= [2300000, 1900000, 1600000, 1300000, 1100000]

[mtk-gpu-table-mapping]
mode= enabled
sensor= front_temp
threshold= [42000, 44000, 46000]
hysteresis= [2000, 2000, 2000]
freq= [978000,842000, 775000]

[general-cooler]
sensor= front_temp
sensor_class= virtual
cooler= apu_cooler
cooler_class= kernel
algorithm= table_mapping
threshold= [46000, 48000]
hysteresis= [2000, 2000]
limit_state= [3, 6]

[thermalhal-threshold]
type= USB_PORT
sensor= conn_ntc
level= [moderate]
threshold= [70000]

[general-cooler]
sensor= conn_ntc
sensor_class= kernel
cooler= typec_otp
cooler_class= kernel
algorithm= table_mapping
threshold= [70000]
hysteresis= [10000]
limit_state= [1]

[charger-cooler]
mode= enabled
sensor= back_temp
threshold= [35000, 36000, 37000, 38000, 39000, 41000, 45000]
hysteresis= [1000, 1000, 1000, 1000, 1000, 2000, 2000]
current= [10000, 6000, 5000, 4000, 3000, 1500, 500]

[md-autonomous-ctrl]
mode= disabled

[md-cc-ctrl-cooler]
mode= enabled
sensor= back_temp
threshold= [41000, 42000, 43000, 45000]
hysteresis= [1000, 1000, 1000, 2000]
limit-state= [16712447, 16712191, 16711937, 16711935]

[md-ul-throttle-cooler]
mode= enabled
sensor= back_temp
threshold= [41000, 42000, 43000, 45000]
hysteresis= [1000, 1000, 1000, 2000]
limit-state= [1, 2, 3, 4]
